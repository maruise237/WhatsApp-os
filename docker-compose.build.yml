# Override OPTIONNEL pour construire l'image localement au lieu de la tirer du registre.
# Usage (avancé — exige un VPS >=4 Go de RAM ou du swap ; le build prend ~15-25 min sur un VPS) :
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Le chemin normal (non-initié) N'utilise PAS ce fichier — il tire l'image prête depuis GHCR.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Sans args de secret : l'image est générique (les NEXT_PUBLIC_* deviennent des placeholders
      # au build et les vraies valeurs entrent à l'exécution via env_file). APP_VERSION
      # n'est pas un secret — c'est ce que répond /api/v1/health, et sans lui l'image
      # locale dirait « inconnue », ce qui est la bonne réponse pour une image qui
      # ne vient d'aucune release.
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${APP_IMAGE:-deskcomm-app:local}
    pull_policy: never

  # Le worker et le scheduler ont déjà `build:` dans le compose de production (c'est l'issue de secours
  # qui garde le changement additif). Ce que cet override ajoute, c'est le
  # `pull_policy: never` : sans lui, un `up -d` irait au registre et remplacerait
  # l'image locale en silence — le même mode d'échec que le runbook décrit
  # pour l'app, et qui a déjà mordu une fois.
  worker:
    build:
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${WORKER_IMAGE:-deskcomm-worker:local}
    pull_policy: never

  scheduler:
    build:
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${SCHEDULER_IMAGE:-deskcomm-scheduler:local}
    pull_policy: never
