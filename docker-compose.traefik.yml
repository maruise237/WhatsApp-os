# DeskcommCRM — override pour un VPS qui A DÉJÀ un proxy inverse Traefik.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d
#
# QUAND L'UTILISER
# ----------------
# La stack par défaut démarre un Caddy qui publie les ports 80 et 443. C'est le bon choix
# sur un VPS « nu ». Mais plusieurs hébergeurs livrent le VPS avec leur propre Traefik
# qui occupe déjà ces ports — Hostinger, Coolify, Dokploy, CapRover et consorts. C'est
# ce Traefik qui donne le HTTPS automatique à tout ce que le panneau installe ; l'arrêter
# casserait les automatisations de l'hébergeur, présentes et futures.
#
# Deux processus ne peuvent pas écouter le même port, donc le `up -d` par défaut échoue au
# bind et l'installation meurt au milieu. Avec cet override :
#
#   1. le service `caddy` reçoit un profil qui n'est jamais activé — compose
#      ne le crée tout simplement pas (le Traefik de l'hébergeur joue son rôle) ;
#   2. le service `app` reçoit des labels Traefik qui reproduisent, une à une, les
#      règles du Caddyfile.
#
# Le comportement par défaut (sans ce fichier) reste EXACTEMENT comme avant : qui
# ne passe pas `-f docker-compose.traefik.yml` n'est affecté par rien ici.
#
# ÉQUIVALENCE AVEC LE Caddyfile
# -----------------------------
# - `reverse_proxy app:3000`  → routeur `deskcomm` + loadbalancer.server.port
# - `encode gzip`             → middleware `deskcomm-compress`
# - `respond @waha_global 403`→ routeur `deskcomm-waha-block` (voir ci-dessous)
#
# Les longs timeouts que le Caddyfile donne à /api/internal/agents/run* N'ont PAS besoin
# d'équivalent : dans Traefik le writeTimeout et le responseHeaderTimeout sont déjà
# illimités par défaut, donc une réponse de 5 minutes passe en entier.
#
# PRÉREQUIS DANS LE TRAEFIK DE L'HÉBERGEUR
# ----------------------------------------
# On attend un entrypoint `websecure` (443) et un certresolver `letsencrypt` —
# les noms par défaut de ces installations. Si la vôtre utilise d'autres noms, ajustez
# TRAEFIK_ENTRYPOINT et TRAEFIK_CERTRESOLVER dans le .env.
#
# Le RÉSEAU où Traefik trouve l'app est TRAEFIK_NETWORK, et il varie selon
# l'installation. install.sh le découvre et l'écrit dans le .env — il y a deux scénarios aux
# réponses OPPOSÉES, toutes deux mesurées (le pourquoi de chacune est dans la fonction
# `rede_do_traefik`, dans hostgator-setup-kit/install.sh) :
#
#   Traefik sur un bridge PROPRE (Coolify, Dokploy) → SON réseau, qui existe déjà.
#   Traefik en `--network host` (Hostinger)         → un bridge "<projet>_proxy"
#     qu'install.sh CRÉE. En mode host le proxy n'est dans aucun réseau
#     Docker, et atteint n'importe quel bridge par la pile de l'hôte.
#
# La valeur par défaut ci-dessous ("traefik") couvre l'installation manuelle la plus courante.

services:
  app:
    # Seul `app` entre dans le réseau du proxy. L'inverse — joindre Traefik au réseau
    # `internal` — placerait un conteneur qui sert D'AUTRES locataires du VPS dans
    # un réseau où redis tourne sans mot de passe (docker-compose.prod.yml : `redis-server
    # --save '' --appendonly no`, sans requirepass). waha, redis et srh restent dehors.
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      # Ce label dit à Traefik sur quel réseau prendre l'IP du conteneur. Avec
      # Traefik sur son propre bridge, c'est le réseau du PROXY — en pointant vers
      # `internal` il vise une IP qu'il n'atteint pas et la requête reste pendue jusqu'au
      # timeout, même avec le conteneur déjà connecté aux deux réseaux. Mesuré avec un
      # vrai Traefik v3.3 :
      #   app seulement sur internal, label=internal -> HTTP 000 (timeout)
      #   app sur les deux réseaux, label=internal   -> HTTP 000 (toujours la mauvaise IP)
      #   app sur les deux réseaux, label=proxy      -> HTTP 200
      # Avec Traefik en mode host la conclusion ne s'inverse pas, elle se généralise :
      # c'est toujours le réseau `proxy` — sauf que là c'est le bridge qu'install.sh
      # crée pour ce projet, parce qu'un proxy en mode host n'a pas de réseau propre
      # (et atteint n'importe quel bridge par la pile de l'hôte).
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"

      # Route principale — équivaut au `reverse_proxy app:3000` du Caddyfile.
      traefik.http.routers.deskcomm.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.deskcomm.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.deskcomm.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.routers.deskcomm.middlewares: "deskcomm-compress"
      traefik.http.services.deskcomm.loadbalancer.server.port: "3000"

      # `encode gzip` du Caddyfile.
      traefik.http.middlewares.deskcomm-compress.compress: "true"

      # `respond @waha_global 403` du Caddyfile. Le webhook GLOBAL de WAHA ne
      # doit pas être joignable depuis Internet : qui connaîtrait l'adresse injecterait
      # un faux message dans le CRM et ferait répondre le WhatsApp du propriétaire à un numéro
      # arbitraire. Ici WAHA parle à l'app par le réseau Docker, donc
      # cette route n'a jamais eu besoin d'être publique.
      #
      # Traefik n'a pas de « répondre 403 » direct. L'équivalent est un
      # ipallowlist dont la seule plage autorisée est 192.0.2.1/32 — TEST-NET-1
      # (RFC 5737), une adresse réservée à la documentation qu'aucun client
      # réel n'a. Toute requête vers ce chemin tombe hors de la liste et reçoit 403,
      # ce qui est exactement le comportement voulu. La priorité élevée est ce qui fait
      # gagner cette route sur la principale, qui correspondrait au même Host.
      traefik.http.routers.deskcomm-waha-block.rule: "Host(`${DOMAIN}`) && Path(`/api/v1/webhooks/waha`)"
      traefik.http.routers.deskcomm-waha-block.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.deskcomm-waha-block.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.routers.deskcomm-waha-block.priority: "1000"
      traefik.http.routers.deskcomm-waha-block.service: "deskcomm"
      traefik.http.routers.deskcomm-waha-block.middlewares: "deskcomm-deny"
      traefik.http.middlewares.deskcomm-deny.ipallowlist.sourcerange: "192.0.2.1/32"

      # HTTP -> HTTPS. Caddy le faisait automatiquement ; dans Traefik il faut le
      # dire. Sans ce routeur, qui tape http:// ne reçoit aucune réponse.
      traefik.http.routers.deskcomm-http.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.deskcomm-http.entrypoints: "${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      traefik.http.routers.deskcomm-http.middlewares: "deskcomm-https"
      traefik.http.routers.deskcomm-http.service: "deskcomm"
      traefik.http.middlewares.deskcomm-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.deskcomm-https.redirectscheme.permanent: "true"

  # Caddy n'est pas retiré du compose (cela exigerait d'éditer le fichier de base et
  # casserait qui utilise le défaut) — il est seulement placé dans un profil qui n'est jamais
  # activé. Sans profil actif, compose ne crée pas le conteneur et les ports 80/443
  # restent au Traefik de l'hébergeur.
  #
  # ATTENTION à un détail de Compose : nommer le service explicitement
  # (`docker compose up -d caddy`) ACTIVE son profil automatiquement et le
  # conteneur démarre quand même, en conflit direct avec Traefik. C'est pourquoi
  # update.sh vérifie REVERSE_PROXY avant de recréer le proxy.
  caddy:
    profiles: ["caddy-nao-usado-com-proxy-externo"]

# `external: true` = ce n'est pas compose qui crée ce réseau. Dans les deux scénarios il
# existe déjà quand le `up -d` tourne : soit c'est le réseau du proxy de l'hébergeur (coolify,
# dokploy-network, traefik...), soit c'est le bridge qu'install.sh a créé pour ce
# projet quand Traefik est en mode host.
#
# Un réseau externe ABSENT est refusé AVANT que compose ne crée quoi que ce soit —
# mesuré avec compose v2.38.2 contre ce même fichier : « network X declared as
# external, but could not be found », sans dire d'où vient le nom. Cela vaut
# même quand X est le `<projet>_internal` que compose lui-même créerait dans ce
# même `up` (la vérification du réseau externe vient avant toute création) ; c'est pourquoi
# le bridge du mode host est un réseau séparé, et install.sh le crée avant de démarrer
# la stack.
networks:
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
