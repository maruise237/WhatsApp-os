# Stack locale des dépendances externes de DeskcommCRM.
#
# Démarre seulement WAHA (Plus / NOWEB) pour le développement. Postgres + Auth + Storage
# viennent de la base cloud (ou d'une base locale séparée, selon la préférence de l'équipe).
#
# Usage :
#   1. Copiez .env.example -> .env.local et remplissez WAHA_API_KEY (texte clair)
#   2. Générez le hash : echo -n "$WAHA_API_KEY" | shasum -a 512 | awk '{print $1}'
#   3. Collez ce hash dans WAHA_API_KEY ci-dessous (PAS le texte clair)
#   4. docker compose up -d
#   5. Ouvrez http://localhost:3030/dashboard/ (interface de WAHA Plus)
#      (port hôte 3030 — :3000 reste réservé à d'autres outils de dev comme Remotion)
#
# En prod, WAHA tourne sur un VPS dédié (HostGator) derrière Nginx (proxy_buffering off
# pour le SSE). Ce docker-compose est réservé au DEV.

version: "3.9"

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Hash SHA512 hex de la clé d'API (PAS le texte clair). Le client envoie le texte clair dans X-Api-Key.
      WAHA_API_KEY: ${WAHA_API_KEY_SHA512}
      # URL de base du webhook — doit être publique (utilisez ngrok/cloudflared en dev).
      # host.docker.internal : l'app Next tourne sur l'HÔTE en dev — localhost dans le
      # conteneur serait WAHA lui-même et le webhook n'arriverait jamais. Port 3002 :
      # la stack de la fusion est isolée du checkout principal (3001 appartient au gov-loop).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      # HMAC SHA512 du payload, validé côté serveur via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Moteur NOWEB par défaut (plus léger, ~150 Mo ; stable). La variable est
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE N'existe PAS dans WAHA et retombait
      # silencieusement sur la valeur par défaut WEBJS (navigateur, bloque la session).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Stockage des médias : stockage objet via le backend (PAS de base64 en ligne).
      WAHA_DASHBOARD_ENABLED: "true"
      # Sans ceci le conteneur revient (ou Docker Desktop se réveille) et les sessions
      # restent STOPPED — le front s'ouvre sur « Connexion… » et les messages de la période
      # hors ligne n'arrivent pas. True reprend celles qui existaient déjà ; ne redemande pas de QR.
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping est le seul endpoint sans auth de ce build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Evolution Go + gateway interne (profil opt-in du Sales OS).
  # WAHA reste disponible pour les installations existantes ; aucun service ne
  # bascule automatiquement de provider.
  evolution-go:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:latest}
    profiles: ["sales-os"]
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      POSTGRES_AUTH_DB: ${EVOLUTION_GO_POSTGRES_AUTH_DB}
      POSTGRES_USERS_DB: ${EVOLUTION_GO_POSTGRES_USERS_DB}
      DATABASE_SAVE_MESSAGES: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://whatsapp-gateway:8788/webhooks/evolution-go
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_GLOBAL_HEADERS: '{"Authorization":"Bearer ${EVOLUTION_GO_WEBHOOK_SECRET}"}'
    volumes:
      - evolution-go-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/swagger/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SeaweedFS en UN conteneur (master + volume + filer + S3) — voir
  # docker-compose.dokploy.yml pour le pourquoi.
  seaweedfs-s3:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    profiles: ["sales-os"]
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 200MiB
    command: ["server", "-dir=/data", "-ip=seaweedfs-s3", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=1024", "-volume.max=0", "-filer", "-s3", "-s3.port=8333"]
    volumes: ["seaweedfs-data:/data"]
    expose: ["8333"]

  whatsapp-gateway:
    build:
      context: ./services/whatsapp-gateway
      dockerfile: Dockerfile
    profiles: ["sales-os"]
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      GATEWAY_PORT: 8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      EVOLUTION_GO_BASE_URL: http://evolution-go:8080
      EVOLUTION_GO_API_KEY: ${EVOLUTION_GO_API_KEY}
      EVOLUTION_GO_WEBHOOK_SECRET: ${EVOLUTION_GO_WEBHOOK_SECRET}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      SEAWEEDFS_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET:-media-bucket}
    depends_on:
      evolution-go:
        condition: service_started
    ports:
      - "8788:8788"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Worker 24/7 de l'agent-engine (fusion Vendaval) : file, cron/relances, drain de
  # l'event_log et tours de l'agent riche. Postgres = base cloud (SUPABASE_DB_URL dans le
  # .env.local). Démarre avec WAHA : `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dans le conteneur, localhost est le worker lui-même — WAHA est sur le réseau
      # du compose (service waha, port interne 3000). Remplace le .env.local.
      WAHA_API_BASE_URL: http://waha:3000
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp-gateway:8788
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explicite : localhost se résout en ::1 et le healthz n'écoute qu'en IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  waha-data:
  waha-media:
  evolution-go-data:
  seaweedfs-data:
