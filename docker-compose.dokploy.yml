# Stack de production pour Dokploy.
# Dokploy fournit Traefik et la terminaison TLS : aucun Caddy n’est lancé ici.
# Le service Compose est lié à ce fichier via le provider Git `maruise237/WhatsApp-os`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/maruise237/deskcommcrm:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp-gateway:8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
      whatsapp-gateway:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-dokploy-network}"
      traefik.http.routers.whatsapp-os.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.whatsapp-os.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.whatsapp-os.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.whatsapp-os.loadbalancer.server.port: "3000"

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/maruise237/deskcomm-worker:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp-gateway:8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
    depends_on:
      app:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/maruise237/deskcomm-scheduler:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    expose:
      - "3000"
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  evolution-postgres-auth:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_GO_POSTGRES_PASSWORD}
      POSTGRES_DB: evo_auth
    volumes:
      - evolution-postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evo_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  evolution-postgres-users:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_GO_POSTGRES_PASSWORD}
      POSTGRES_DB: evo_users
    volumes:
      - evolution-postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evo_users"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  evolution-go:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_GO_POSTGRES_PASSWORD}@evolution-postgres-auth:5432/evo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_GO_POSTGRES_PASSWORD}@evolution-postgres-users:5432/evo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://whatsapp-gateway:8788/webhooks/evolution-go
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_GLOBAL_HEADERS: '{"Authorization":"Bearer ${EVOLUTION_GO_WEBHOOK_SECRET}"}'
    volumes:
      - evolution-go-data:/app/data
    expose:
      - "8080"
    depends_on:
      evolution-postgres-auth:
        condition: service_healthy
      evolution-postgres-users:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/swagger/index.html",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [internal]

  whatsapp-gateway:
    build:
      context: ./services/whatsapp-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      EVOLUTION_GO_BASE_URL: http://evolution-go:8080
      EVOLUTION_GO_API_KEY: ${EVOLUTION_GO_API_KEY}
      EVOLUTION_GO_WEBHOOK_SECRET: ${EVOLUTION_GO_WEBHOOK_SECRET}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      SEAWEEDFS_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET:-media-bucket}
      APP_INTERNAL_BASE_URL: http://app:3000
    depends_on:
      evolution-go:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks: [internal]

  seaweedfs-master:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    command: ["master", "-ip=seaweedfs-master", "-ip.bind=0.0.0.0"]
    expose: ["9333"]
    networks: [internal]

  seaweedfs-volume:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    command:
      [
        "volume",
        "-mserver=seaweedfs-master:9333",
        "-ip=seaweedfs-volume",
        "-ip.bind=0.0.0.0",
        "-dir=/data",
      ]
    depends_on: [seaweedfs-master]
    volumes: ["seaweedfs-volume-data:/data"]
    expose: ["8080"]
    networks: [internal]

  seaweedfs-filer:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    command: ["filer", "-master=seaweedfs-master:9333", "-ip.bind=0.0.0.0"]
    depends_on: [seaweedfs-master, seaweedfs-volume]
    expose: ["8888"]
    networks: [internal]

  seaweedfs-s3:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    command: ["s3", "-filer=seaweedfs-filer:8888", "-ip.bind=0.0.0.0", "-port=8333"]
    depends_on: [seaweedfs-filer]
    expose: ["8333"]
    networks: [internal]

volumes:
  waha-data:
  waha-media:
  evolution-go-data:
  evolution-postgres-auth-data:
  evolution-postgres-users-data:
  seaweedfs-volume-data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-dokploy-network}"
