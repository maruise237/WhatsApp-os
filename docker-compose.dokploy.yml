# Stack de production pour Dokploy — version allégée.
# Dokploy fournit Traefik et la terminaison TLS : aucun Caddy n’est lancé ici.
# Le service Compose est lié à ce fichier via le provider Git `maruise237/WhatsApp-os`.
#
# ─── Ce qui démarre ─────────────────────────────────────────────────────────
#
# Toujours (cœur, ~1,2 Go de plafond cumulé) :
#   app · worker · scheduler · evolution-go · evolution-db · whatsapp-gateway · seaweedfs
#
# En option, via `COMPOSE_PROFILES` dans les variables Dokploy :
#   waha   → moteur WhatsApp historique (WAHA). N’activez-le QUE si vous avez
#            encore des numéros connectés par WAHA : deux moteurs WhatsApp en
#            parallèle doublent la RAM pour rien.
#   redis  → Redis + proxy REST (srh). Inutile sur une seule VPS : le
#            rate-limit et le debounce du RAG ont un repli en mémoire. Utile
#            seulement si vous lancez plusieurs instances de l’app.
#   Exemple : COMPOSE_PROFILES=redis   ou   COMPOSE_PROFILES=waha,redis
#
# ─── Avant / après ──────────────────────────────────────────────────────────
#
# Avant : 14 conteneurs sans aucune limite mémoire — WAHA ET Evolution Go en
# même temps, deux Postgres pour Evolution, SeaweedFS en quatre conteneurs,
# Redis + srh, et un worker qui exécutait le TypeScript via tsx (2,2 Go
# d’image, ~200 Mo de RAM). Après : 7 conteneurs par défaut, chacun plafonné.
# Détail et mesures : docs/runbooks/stack-legere.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/maruise237/deskcommcrm:main}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    # Plafond : le pic mesuré de l’app est ~335 Mo. Le tas V8 est borné en
    # dessous du plafond pour que le GC travaille avant que le noyau ne tue.
    mem_limit: ${APP_MEM_LIMIT:-640m}
    environment:
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=448}
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp-gateway:8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      SEAWEEDFS_S3_ENDPOINT: ${SEAWEEDFS_S3_ENDPOINT:-http://seaweedfs:8333}
    depends_on:
      whatsapp-gateway:
        condition: service_healthy
      # Services optionnels : absents si leur profil n’est pas activé.
      srh:
        condition: service_started
        required: false
      waha:
        condition: service_started
        required: false
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-dokploy-network}"
      traefik.http.routers.whatsapp-os.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.whatsapp-os.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.whatsapp-os.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.whatsapp-os.loadbalancer.server.port: "3000"

  worker:
    # Image compilée en un seul fichier JS (Dockerfile.worker) : ~90 Mo de RAM
    # au repos, mesuré, contre ~200 Mo quand elle exécutait le TS via tsx.
    image: ${WORKER_IMAGE:-ghcr.io/maruise237/deskcomm-worker:main}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    mem_limit: ${WORKER_MEM_LIMIT:-320m}
    environment:
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=224}
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp-gateway:8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      SEAWEEDFS_S3_ENDPOINT: ${SEAWEEDFS_S3_ENDPOINT:-http://seaweedfs:8333}
      # 8 tours d’agent en parallèle est dimensionné pour un gros parc ; sur
      # une petite VPS, 4 suffit et borne le pic mémoire.
      QUEUE_MAX_CONCURRENCY: ${QUEUE_MAX_CONCURRENCY:-4}
    depends_on:
      app:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/maruise237/deskcomm-scheduler:main}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    mem_limit: 32m
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  # ─── WhatsApp : Evolution Go derrière le gateway (P6) ──────────────────────

  # UN seul Postgres pour les deux bases d’Evolution Go (avant : deux
  # conteneurs postgres:15 complets). Réglé pour une petite charge : Evolution
  # ne stocke pas les messages (DATABASE_SAVE_MESSAGES=false).
  evolution-db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 160m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_GO_POSTGRES_PASSWORD}
      POSTGRES_DB: evo_auth
    configs:
      - source: evolution-db-init
        target: /docker-entrypoint-initdb.d/10-evo-users.sql
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evo_auth && psql -U evolution -d evo_users -tAc 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  evolution-go:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:latest}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # Le runtime Go rend la mémoire au système avant d’atteindre le plafond.
      GOMEMLIMIT: 200MiB
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_GO_POSTGRES_PASSWORD}@evolution-db:5432/evo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_GO_POSTGRES_PASSWORD}@evolution-db:5432/evo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://whatsapp-gateway:8788/webhooks/evolution-go
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_GLOBAL_HEADERS: '{"Authorization":"Bearer ${EVOLUTION_GO_WEBHOOK_SECRET}"}'
    volumes:
      - evolution-go-data:/app/data
    expose:
      - "8080"
    depends_on:
      evolution-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/swagger/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [internal]

  whatsapp-gateway:
    # Image publiée par le CI ; le `build:` reste comme secours (registry
    # indisponible), jamais comme chemin normal — doctrine de packaging.
    image: ${GATEWAY_IMAGE:-ghcr.io/maruise237/whatsapp-gateway:main}
    pull_policy: always
    build:
      context: ./services/whatsapp-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 96m
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      GATEWAY_PORT: 8788
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      EVOLUTION_GO_BASE_URL: http://evolution-go:8080
      EVOLUTION_GO_API_KEY: ${EVOLUTION_GO_API_KEY}
      EVOLUTION_GO_WEBHOOK_SECRET: ${EVOLUTION_GO_WEBHOOK_SECRET}
      APP_INTERNAL_BASE_URL: http://app:3000
    depends_on:
      evolution-go:
        condition: service_healthy
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks: [internal]

  # ─── Médias : SeaweedFS en UN conteneur ────────────────────────────────────
  #
  # `weed server` fait tourner master + volume + filer + S3 dans un seul
  # processus. Avant : quatre conteneurs, et le filer n’avait AUCUN volume —
  # l’index des fichiers disparaissait à chaque recréation du conteneur, les
  # blobs restant orphelins. Ici tout vit dans /data, persisté.
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.80}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 200MiB
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      # Volumes de 1 Go au lieu de 30 Go par défaut : sur un petit disque,
      # SeaweedFS n’en réserve pas plus qu’il n’en faut.
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
    volumes:
      - seaweedfs-data:/data
    expose: ["8333"]
    logging: *default-logging
    networks:
      internal:
        # Ancien nom du service S3 : un .env existant qui pointe vers
        # http://seaweedfs-s3:8333 continue de fonctionner sans modification.
        aliases:
          - seaweedfs-s3

  # ─── Optionnels ────────────────────────────────────────────────────────────

  waha:
    profiles: ["waha"]
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      WHATSAPP_API_HOSTNAME: 0.0.0.0
      WHATSAPP_API_PORT: 3000
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    expose:
      - "3000"
    logging: *default-logging
    networks:
      internal:
        aliases:
          - waha-internal

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    # Éphémère (rate-limit / debounce) et borné : jamais plus de 32 Mo.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]

  srh:
    profiles: ["redis"]
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    mem_limit: 160m
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

configs:
  evolution-db-init:
    content: |
      create database evo_users owner evolution;

volumes:
  waha-data:
  waha-media:
  evolution-go-data:
  evolution-db-data:
  seaweedfs-data:
  # Volumes de l’ancienne stack, gardés déclarés pour qu’aucun déploiement ne
  # les supprime avant la migration (docs/runbooks/stack-legere.md). Aucun
  # service ne les monte plus ; supprimez-les à la main une fois migrés.
  evolution-postgres-auth-data-v2:
  evolution-postgres-users-data-v2:
  seaweedfs-volume-data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-dokploy-network}"
