name: ci

on:
  pull_request:
  push:
    branches: [main]

# Aucun secret : rien ici n'a besoin d'écrire sur le dépôt.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Fournisseur de canal hors de sa couche
        run: pnpm lint:channels
      - name: Tests unitaires
        run: pnpm test:unit
      - name: Scripts shell
        run: pnpm test:shell

  # Base jetable pg17 + émulation Neon + db/migrations (installation puis
  # rejeu = idempotence), puis tests d'invariants dont l'isolation entre
  # organisations (scripts/test-db.sh).
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Invariants (RLS, droits, schéma)
        run: pnpm test:db
